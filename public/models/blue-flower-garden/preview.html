<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg">
  <title>Level 05: Blue Flower Garden — Himmel & Frieren 3D Asset Inspection</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #cbe3fc;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #1e293b;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 25px rgba(0, 30, 80, 0.12);
      pointer-events: auto;
      z-index: 10;
    }
    #ui-hud h1 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #1d4ed8;
      letter-spacing: 0.5px;
    }
    #ui-hud p {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #475569;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-view {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-view:hover {
      background: #2563eb;
    }
    #status-pill {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      margin-bottom: 6px;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/.vite/deps/three.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui-hud">
    <div id="status-pill">LEVEL 05: BLUE FLOWER GARDEN</div>
    <h1>Himmel & Frieren — The Eternal Meadow</h1>
    <p>Dense blue flower carpet, anime cumulus clouds & animated characters.</p>
    <div class="btn-row">
      <button class="btn-view" onclick="window.gardenPreview?.shot('heroFront')">Reference View</button>
      <button class="btn-view" onclick="window.gardenPreview?.shot('overview')">Aerial Overview</button>
      <button class="btn-view" onclick="window.gardenPreview?.shot('romanceCloseUp')">Intimate Close-Up</button>
      <button class="btn-view" onclick="window.gardenPreview?.shot('horizonDistant')">Horizon Diagonal</button>
      <button class="btn-view" onclick="window.gardenPreview?.shot('undersideInspection')">Underside</button>
    </div>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
