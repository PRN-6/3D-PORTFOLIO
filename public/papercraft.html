<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerosHome — Isometric Papercraft Pop-Up Assembly</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F7F5F0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        input[type="range"] {
            accent-color: #3f3b35;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div
        class="fixed top-4 left-4 z-20 flex items-center gap-3 rounded-xl border border-stone-200/80 bg-white/90 px-3.5 py-2 shadow-sm backdrop-blur-md">
        <span id="stage-dot" class="h-2.5 w-2.5 rounded-full bg-emerald-600"></span>
        <div>
            <div class="text-xs font-semibold tracking-tight text-stone-800">HerosHome Diorama</div>
            <div id="stage-label" class="text-[11px] text-stone-500">Loading ./home-island.glb…</div>
        </div>
        <label
            class="ml-2 cursor-pointer rounded-lg border border-stone-200 bg-stone-50 px-2.5 py-1 text-[11px] font-medium text-stone-700 hover:bg-stone-100">
            Open .glb
            <input id="file-input" type="file" accept=".glb,.gltf" class="hidden" />
        </label>
    </div>

    <aside
        class="fixed bottom-4 left-4 z-20 w-[calc(100vw-2rem)] max-w-xs rounded-2xl border border-stone-200/80 bg-white/90 p-4 shadow-lg backdrop-blur-md">
        <div class="mb-2.5 flex items-center justify-between">
            <div>
                <h2 class="text-sm font-semibold text-stone-800">Papercraft Assembly</h2>
                <p id="frame-readout" class="text-xs text-stone-500">Frame 0 / 60 (0%)</p>
            </div>
            <button id="btn-reset-cam" type="button"
                class="rounded-lg border border-stone-200 px-2.5 py-1 text-xs font-medium text-stone-600 hover:bg-stone-100">
                Reset View
            </button>
        </div>

        <input id="scrubber" type="range" min="0" max="1" step="0.001" value="0" class="mb-3 w-full cursor-pointer"
            aria-label="Assembly timeline progress" />

        <div class="mb-3 grid grid-cols-4 gap-1.5">
            <button id="btn-play-pause" type="button"
                class="rounded-lg bg-stone-800 px-2 py-1.5 text-xs font-medium text-white hover:bg-stone-700">Play</button>
            <button id="btn-reverse" type="button"
                class="rounded-lg border border-stone-200 px-2 py-1.5 text-xs font-medium text-stone-700 hover:bg-stone-100">Reverse</button>
            <button id="btn-restart" type="button"
                class="rounded-lg border border-stone-200 px-2 py-1.5 text-xs font-medium text-stone-700 hover:bg-stone-100">Restart</button>
            <select id="speed-select"
                class="rounded-lg border border-stone-200 bg-white px-1.5 py-1.5 text-xs text-stone-700"
                aria-label="Playback speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
            </select>
        </div>

        <div class="mb-2.5 flex items-center justify-between text-xs text-stone-600">
            <span id="duration-label">Duration: 2.0s</span>
            <input id="duration-slider" type="range" min="1" max="5" step="0.5" value="2" class="w-32 cursor-pointer"
                aria-label="Animation duration" />
        </div>

        <div class="flex flex-col gap-1.5 border-t border-stone-100 pt-2.5 text-xs text-stone-700">
            <label class="flex cursor-pointer items-center justify-between">
                <span>Papercraft Matte Mode</span>
                <input id="toggle-papercraft" type="checkbox" class="cursor-pointer" />
            </label>
            <label class="flex cursor-pointer items-center justify-between">
                <span>Ambient Character Idle</span>
                <input id="toggle-idle" type="checkbox" checked class="cursor-pointer" />
            </label>
        </div>
    </aside>

    <script>
        const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
        const frameRangeProgress = (f, start, end) =>
            end <= start ? (f >= end ? 1 : 0) : clamp01((f - start) / (end - start));

        const easeOutCubic = (t) => 1 - Math.pow(1 - clamp01(t), 3);

        function easeOutWithOvershoot(t, overshoot = 0.04) {
            const x = clamp01(t);
            if (x === 0 || x === 1) return x;
            const s = 1.70158 + overshoot * 12;
            const u = x - 1;
            return 1 + (s + 1) * Math.pow(u, 3) + s * Math.pow(u, 2);
        }

        function hingeFoldCurve(t, ov = 0.065) {
            const x = clamp01(t);
            if (x === 0 || x === 1) return x;
            if (x < 0.78) return (1 - Math.pow(1 - x / 0.78, 2.6)) * (1 + ov);
            const u = (x - 0.78) / 0.22;
            return 1 + ov * (1 - (0.5 - 0.5 * Math.cos(Math.PI * u)));
        }

        function elasticPopScaleCurve(t, maxO = 1.08, corr = 0.97) {
            const x = clamp01(t);
            if (x === 0 || x === 1) return x;
            if (x < 0.55) return (1 - Math.pow(1 - x / 0.55, 2.4)) * maxO;
            if (x < 0.8) {
                const u = (x - 0.55) / 0.25;
                return maxO + (corr - maxO) * (0.5 - 0.5 * Math.cos(Math.PI * u));
            }
            const u = (x - 0.8) / 0.2;
            return corr + (1 - corr) * (0.5 - 0.5 * Math.cos(Math.PI * u));
        }

        function easeOutBackFast(t, ov = 1.07) {
            const x = clamp01(t);
            if (x === 0 || x === 1) return x;
            const c1 = (ov - 1) * 18;
            return 1 + (c1 + 1) * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function evalCubicBezier3D(p0, p1, p2, p3, t, out) {
            const u = clamp01(t), inv = 1 - u;
            const b0 = inv ** 3, b1 = 3 * inv ** 2 * u, b2 = 3 * inv * u ** 2, b3 = u ** 3;
            out.x = b0 * p0.x + b1 * p1.x + b2 * p2.x + b3 * p3.x;
            out.y = b0 * p0.y + b1 * p1.y + b2 * p2.y + b3 * p3.y;
            out.z = b0 * p0.z + b1 * p1.z + b2 * p2.z + b3 * p3.z;
        }

        function dampedSway(t, amplitude = 0.045, cycles = 2) {
            const x = clamp01(t);
            if (x <= 0 || x >= 1) return 0;
            return amplitude * Math.pow(1 - x, 2) * Math.sin(Math.PI * x) * Math.sin(cycles * Math.PI * 2 * x);
        }

        class TransformManager {
            createPivotWrapper(object, worldPivot, name) {
                const parent = object.parent;
                parent.updateMatrixWorld(true);
                object.updateMatrixWorld(true);
                const wrapper = new THREE.Group();
                wrapper.name = name;
                wrapper.position.copy(parent.worldToLocal(worldPivot.clone()));
                const idx = parent.children.indexOf(object);
                parent.add(wrapper);
                if (idx >= 0) {
                    parent.children.splice(parent.children.indexOf(wrapper), 1);
                    parent.children.splice(idx, 0, wrapper);
                }
                wrapper.updateMatrixWorld(true);
                wrapper.attach(object);
                return wrapper;
            }
        }

        class ModelHierarchyAnalyzer {
            analyze(root) {
                const FOUNDATION = new Set(['FloatingIsland', 'Meadow', 'WaystonePath']);
                const STRUCTURE = new Set(['BackBoundary', 'TimberFrame', 'PorchAndOakDoor', 'ShingledGables', 'FieldstoneChimney']);
                const PRIMARY = new Set([
                    'PracticeYard', 'GardenSupplies', 'HearthsideSeats', 'Campfire',
                    'Woodpile', 'GardenStool', 'MainTree', 'WindwardFir', 'YoungFir',
                    'Frieren', 'Himmel', 'Heiter', 'Eisen'
                ]);
                const PROPS = new Set([
                    'CropPatchCarrots', 'CropPatchCabbages', 'CropPatchSquash', 'Scarecrow',
                    'WateringCan', 'TrainingDummy', 'PracticeTarget', 'WeaponRack', 'WoodenSword',
                    'PorchSign', 'GardenGateLantern', 'HearthFlame1', 'HearthFlame2', 'HearthFlame3',
                    'ChimneyWisp1', 'ChimneyWisp2', 'ChimneyWisp3', 'ChimneyWisp4'
                ]);
                const DECOR = new Set(['CliffIvyAndRoots', 'WildflowerBanks']);

                const out = { foundation: [], structure: [], primaryFurniture: [], secondaryProps: [], decorations: [] };
                const charRoots = new Set();
                root.traverse((o) => { if (['Frieren', 'Himmel', 'Heiter', 'Eisen'].includes(o.name)) charRoots.add(o); });
                const underChar = (o) => { for (let p = o.parent; p; p = p.parent) if (charRoots.has(p)) return true; return false; };

                root.traverse((obj) => {
                    if (obj === root || underChar(obj)) return;
                    if (FOUNDATION.has(obj.name)) out.foundation.push(obj);
                    else if (STRUCTURE.has(obj.name)) out.structure.push(obj);
                    else if (PRIMARY.has(obj.name)) out.primaryFurniture.push(obj);
                    else if (PROPS.has(obj.name)) out.secondaryProps.push(obj);
                    else if (DECOR.has(obj.name)) out.decorations.push(obj);
                });
                return out;
            }
        }

        class PopUpAssemblyEngine {
            constructor() {
                this.totalFrames = 60;
                this.durationSeconds = 2.0;
                this.speed = 1.0;
                this.isPlaying = false;
                this.direction = 1;
                this.progress = 0;
                this.tm = new TransformManager();
                this.analyzer = new ModelHierarchyAnalyzer();
                this.hinges = [];
                this.pops = [];
                this.foliage = [];
                this.matBackups = new Map();
                this.tmp = { x: 0, y: 0, z: 0 };
            }

            initialize(root) {
                this.hinges = [];
                this.pops = [];
                this.foliage = [];
                this.matBackups.clear();

                root.traverse((o) => {
                    if (o.isMesh) {
                        const mats = Array.isArray(o.material) ? o.material : [o.material];
                        mats.forEach((m) => {
                            if (m && typeof m.roughness === 'number' && !this.matBackups.has(m)) {
                                this.matBackups.set(m, { roughness: m.roughness, metalness: m.metalness || 0 });
                            }
                        });
                    }
                });

                const cls = this.analyzer.analyze(root);
                const box = new THREE.Box3();
                const center = new THREE.Vector3();

                const fTiming = { FloatingIsland: [1, 16, -0.55], Meadow: [5, 16, -0.08], WaystonePath: [7, 16, -0.06] };
                cls.foundation.forEach((obj) => {
                    obj.updateMatrixWorld(true);
                    box.setFromObject(obj);
                    box.getCenter(center);
                    const py = obj.name === 'FloatingIsland' ? 0 : box.min.y;
                    const wrapper = this.tm.createPivotWrapper(obj, new THREE.Vector3(center.x, py, center.z), 'FoundPivot_' + obj.name);
                    const [start, end, lift] = fTiming[obj.name] || [2, 16, -0.2];
                    this.pops.push({ wrapper, cat: 'FOUND', start, end, lift, tilt: 0, baseY: wrapper.position.y });
                });

                const hSpec = {
                    BackBoundary: { start: 5, end: 19, edge: 'back', axis: 'x', angle: Math.PI * 0.48 },
                    TimberFrame: { start: 7, end: 22, edge: 'back', axis: 'x', angle: Math.PI * 0.5 },
                    PorchAndOakDoor: { start: 10, end: 24, edge: 'front', axis: 'x', angle: -Math.PI * 0.5 },
                    ShingledGables: { start: 13, end: 25, edge: 'back', axis: 'x', angle: Math.PI * 0.44 },
                    FieldstoneChimney: { start: 15, end: 25, edge: 'left', axis: 'z', angle: Math.PI * 0.42 }
                };
                cls.structure.forEach((obj) => {
                    obj.updateMatrixWorld(true);
                    box.setFromObject(obj);
                    box.getCenter(center);
                    const spec = hSpec[obj.name];
                    const piv = new THREE.Vector3(center.x, box.min.y, center.z);
                    if (spec.edge === 'back') piv.z = box.min.z;
                    else if (spec.edge === 'front') piv.z = box.max.z;
                    else if (spec.edge === 'left') piv.x = box.min.x;
                    const wrapper = this.tm.createPivotWrapper(obj, piv, 'HingePivot_' + obj.name);
                    this.hinges.push({ wrapper, spec });
                });

                const pOrder = ['PracticeYard', 'GardenSupplies', 'HearthsideSeats', 'Campfire', 'Woodpile', 'GardenStool', 'MainTree', 'WindwardFir', 'YoungFir', 'Frieren', 'Himmel', 'Heiter', 'Eisen'];
                cls.primaryFurniture.sort((a, b) => pOrder.indexOf(a.name) - pOrder.indexOf(b.name));
                cls.primaryFurniture.forEach((obj, idx) => {
                    obj.updateMatrixWorld(true);
                    box.setFromObject(obj);
                    box.getCenter(center);
                    const wrapper = this.tm.createPivotWrapper(obj, new THREE.Vector3(center.x, box.min.y, center.z), 'PrimPivot_' + obj.name);
                    const start = Math.min(30, 12 + idx * 1.4);
                    this.pops.push({ wrapper, cat: 'PRIM', start, end: Math.min(40, start + 11), lift: 0.14, tilt: (idx % 2 === 0 ? 1 : -1) * 0.035, baseY: wrapper.position.y });
                });

                const sOrder = ['CropPatchCarrots', 'CropPatchCabbages', 'CropPatchSquash', 'Scarecrow', 'WateringCan', 'WeaponRack', 'TrainingDummy', 'PracticeTarget', 'WoodenSword', 'PorchSign', 'GardenGateLantern', 'HearthFlame1', 'HearthFlame2', 'HearthFlame3', 'ChimneyWisp1', 'ChimneyWisp2', 'ChimneyWisp3', 'ChimneyWisp4'];
                cls.secondaryProps.sort((a, b) => sOrder.indexOf(a.name) - sOrder.indexOf(b.name));
                cls.secondaryProps.forEach((obj, idx) => {
                    obj.updateMatrixWorld(true);
                    box.setFromObject(obj);
                    box.getCenter(center);
                    const wrapper = this.tm.createPivotWrapper(obj, new THREE.Vector3(center.x, box.min.y, center.z), 'PropPivot_' + obj.name);
                    const start = Math.min(47, 20 + idx * 1.6);
                    this.pops.push({ wrapper, cat: 'PROP', start, end: Math.min(55, start + 8), lift: 0.08, tilt: (idx % 2 === 0 ? -1 : 1) * 0.04, baseY: wrapper.position.y });
                });

                cls.decorations.forEach((obj, idx) => {
                    obj.updateMatrixWorld(true);
                    box.setFromObject(obj);
                    box.getCenter(center);
                    const wrapper = this.tm.createPivotWrapper(obj, new THREE.Vector3(center.x, box.min.y, center.z), 'FoliagePivot_' + obj.name);
                    const basePos = wrapper.position.clone();
                    const sign = idx % 2 === 0 ? 1 : -1;
                    const start = obj.name === 'CliffIvyAndRoots' ? 15 : 26;
                    this.foliage.push({
                        wrapper,
                        start,
                        end: Math.min(60, start + 28),
                        pts: [
                            basePos.clone().add(new THREE.Vector3(sign * 0.9, -0.5, -0.6)),
                            basePos.clone().add(new THREE.Vector3(sign * 0.6, 0.45, 0.25)),
                            basePos.clone().add(new THREE.Vector3(-sign * 0.2, 0.22, 0.12)),
                            basePos.clone()
                        ],
                        rot0: [0.18, sign * 0.35, -sign * 0.14]
                    });
                });

                this.evaluateAtProgress(this.progress);
            }

            evaluateAtProgress(p) {
                this.progress = clamp01(p);
                const frame = this.progress * this.totalFrames;

                for (const c of this.pops) {
                    const t = frameRangeProgress(frame, c.start, c.end);
                    if (t <= 0) { c.wrapper.visible = false; c.wrapper.scale.set(0.0001, 0.0001, 0.0001); continue; }
                    c.wrapper.visible = true;
                    if (c.cat === 'FOUND') {
                        const s = easeOutWithOvershoot(t, 0.04);
                        c.wrapper.scale.set(s, Math.max(0.01, s), s);
                        c.wrapper.position.y = c.baseY + c.lift * (1 - Math.min(1, easeOutWithOvershoot(t, 0.02)));
                    } else if (c.cat === 'PRIM') {
                        const s = elasticPopScaleCurve(t, 1.08, 0.97);
                        c.wrapper.scale.set(s, s, s);
                        c.wrapper.position.y = c.baseY + Math.sin(Math.PI * Math.min(1, t * 1.15)) * c.lift * (1 - t);
                        const tilt = Math.sin(Math.PI * t) * c.tilt * (1 - t);
                        c.wrapper.rotation.set(tilt, 0, tilt * 0.5);
                    } else {
                        const s = easeOutBackFast(t, 1.07);
                        c.wrapper.scale.set(s, s, s);
                        c.wrapper.position.y = c.baseY + Math.sin(Math.PI * t) * c.lift * (1 - t);
                        c.wrapper.rotation.set(0, 0, Math.sin(Math.PI * t) * c.tilt * (1 - t));
                    }
                }

                for (const h of this.hinges) {
                    const t = frameRangeProgress(frame, h.spec.start, h.spec.end);
                    if (t <= 0) { h.wrapper.visible = false; h.wrapper.rotation.set(0, 0, 0); h.wrapper.scale.set(1, 0.01, 1); continue; }
                    h.wrapper.visible = true;
                    const angle = h.spec.angle * (1 - hingeFoldCurve(t, 0.065));
                    h.wrapper.scale.set(1, Math.min(1, t * 4), 1);
                    h.wrapper.rotation.set(h.spec.axis === 'x' ? angle : 0, 0, h.spec.axis === 'z' ? angle : 0);
                }

                for (const f of this.foliage) {
                    const t = frameRangeProgress(frame, f.start, f.end);
                    if (t <= 0) { f.wrapper.visible = false; f.wrapper.scale.set(0.0001, 0.0001, 0.0001); continue; }
                    f.wrapper.visible = true;
                    const sweepT = Math.min(1, t / 0.75);
                    const eased = easeOutCubic(sweepT);
                    evalCubicBezier3D(f.pts[0], f.pts[1], f.pts[2], f.pts[3], eased, this.tmp);
                    f.wrapper.position.set(this.tmp.x, this.tmp.y, this.tmp.z);
                    const s = sweepT >= 1 ? 1 : Math.min(1, eased * 1.03);
                    f.wrapper.scale.set(s, s, s);
                    const dec = 1 - eased, sway = dampedSway(t, 0.045, 2);
                    f.wrapper.rotation.set(f.rot0[0] * dec + sway * 0.5, f.rot0[1] * dec + sway, f.rot0[2] * dec + sway * 0.7);
                }
            }

            tick(dt) {
                if (!this.isPlaying) return;
                const next = this.progress + (dt * this.speed * this.direction) / this.durationSeconds;
                if (next >= 1) { this.progress = 1; this.isPlaying = false; }
                else if (next <= 0) { this.progress = 0; this.isPlaying = false; }
                else { this.progress = next; }
                this.evaluateAtProgress(this.progress);
            }

            setPapercraftMode(enabled) {
                this.matBackups.forEach((orig, mat) => {
                    mat.roughness = enabled ? 0.85 : orig.roughness;
                    mat.metalness = enabled ? 0.0 : orig.metalness;
                    mat.needsUpdate = true;
                });
            }
        }

        window.onload = function () {
            const container = document.getElementById('canvas-container');
            const scrubber = document.getElementById('scrubber');
            const frameReadout = document.getElementById('frame-readout');
            const stageLabel = document.getElementById('stage-label');
            const btnPlayPause = document.getElementById('btn-play-pause');
            const btnReverse = document.getElementById('btn-reverse');
            const btnRestart = document.getElementById('btn-restart');
            const btnResetCam = document.getElementById('btn-reset-cam');
            const speedSelect = document.getElementById('speed-select');
            const durationSlider = document.getElementById('duration-slider');
            const durationLabel = document.getElementById('duration-label');
            const togglePapercraft = document.getElementById('toggle-papercraft');
            const toggleIdle = document.getElementById('toggle-idle');
            const fileInput = document.getElementById('file-input');

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#F7F5F0');

            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 120);
            function frameCamera() {
                const w = container.clientWidth, h = container.clientHeight;
                const aspect = w / Math.max(1, h);
                const frustum = aspect < 1 ? 15.5 : 13.0;
                camera.left = (-frustum * aspect) / 2;
                camera.right = (frustum * aspect) / 2;
                camera.top = frustum / 2;
                camera.bottom = -frustum / 2;
                const dist = 26, az = Math.PI / 4, el = THREE.MathUtils.degToRad(32);
                const target = new THREE.Vector3(-1.35, 1.15, 0.35);
                camera.position.set(
                    target.x + dist * Math.cos(el) * Math.sin(az),
                    target.y + dist * Math.sin(el),
                    target.z + dist * Math.cos(el) * Math.cos(az)
                );
                camera.lookAt(target);
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            frameCamera();
            window.addEventListener('resize', frameCamera);

            scene.add(new THREE.HemisphereLight('#E6F0FF', '#EFECE6', 0.72));
            scene.add(new THREE.AmbientLight('#E6F0FF', 0.32));
            const sun = new THREE.DirectionalLight('#FFF4E0', 1.55);
            sun.position.set(12, 18, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.set(1024, 1024);
            sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
            sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
            scene.add(sun);

            const shadowFloor = new THREE.Mesh(
                new THREE.PlaneGeometry(80, 80),
                new THREE.ShadowMaterial({ color: '#4A453E', opacity: 0.14 })
            );
            shadowFloor.rotation.x = -Math.PI / 2;
            shadowFloor.position.y = -3.65;
            shadowFloor.receiveShadow = true;
            scene.add(shadowFloor);

            const engine = new PopUpAssemblyEngine();
            let currentModel = null;
            let mixer = null;
            const idleActions = [];

            const gltfLoader = new THREE.GLTFLoader();
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
            gltfLoader.setDRACOLoader(dracoLoader);

            function syncUI() {
                const f = engine.progress * engine.totalFrames;
                scrubber.value = String(engine.progress);
                frameReadout.textContent = `Frame ${Math.round(f)} / 60 (${Math.round(engine.progress * 100)}%)`;
                stageLabel.textContent = f < 1 ? 'Ready to assemble' : f < 16 ? 'Stage 1: Island & Walls' : f < 40 ? 'Stage 2: Furniture & Party' : f < 60 ? 'Stage 3–4: Props & Foliage' : 'Assembled (60 / 60)';
                btnPlayPause.textContent = engine.isPlaying ? 'Pause' : 'Play';
            }

            function onModelLoaded(gltf) {
                if (currentModel) scene.remove(currentModel);
                currentModel = gltf.scene;
                currentModel.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
                scene.add(currentModel);
                engine.initialize(currentModel);

                idleActions.length = 0;
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(currentModel);
                    const idleSet = new Set(['Frieren_Idle', 'Himmel_Idle', 'Heiter_Idle', 'Eisen_Idle', 'CampfireFlicker', 'HearthSmoke']);
                    gltf.animations.forEach((clip) => {
                        if (idleSet.has(clip.name)) {
                            const act = mixer.clipAction(clip);
                            act.play();
                            idleActions.push(act);
                        }
                    });
                }
                engine.evaluateAtProgress(0.05);
                engine.direction = 1;
                engine.isPlaying = true;
                syncUI();
            }

            // Load home-island.glb from local models or relative
            gltfLoader.load('/models/home-island.glb', onModelLoaded, undefined, () => {
                gltfLoader.load('./home-island.glb', onModelLoaded, undefined, () => {
                    stageLabel.textContent = 'Run local server or click "Open .glb"';
                });
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => gltfLoader.parse(reader.result, '', onModelLoaded);
                reader.readAsArrayBuffer(file);
            });

            btnPlayPause.addEventListener('click', () => {
                if (engine.isPlaying) engine.isPlaying = false;
                else { engine.direction = 1; if (engine.progress >= 1) engine.progress = 0; engine.isPlaying = true; }
                syncUI();
            });
            btnReverse.addEventListener('click', () => {
                engine.direction = -1; if (engine.progress <= 0) engine.progress = 1; engine.isPlaying = true; syncUI();
            });
            btnRestart.addEventListener('click', () => {
                engine.direction = 1; engine.evaluateAtProgress(0); engine.isPlaying = true; syncUI();
            });
            btnResetCam.addEventListener('click', frameCamera);
            scrubber.addEventListener('input', (e) => { engine.isPlaying = false; engine.evaluateAtProgress(parseFloat(e.target.value)); syncUI(); });
            speedSelect.addEventListener('change', (e) => { engine.speed = parseFloat(e.target.value); });
            durationSlider.addEventListener('input', (e) => { engine.durationSeconds = parseFloat(e.target.value); durationLabel.textContent = `Duration: ${engine.durationSeconds.toFixed(1)}s`; });
            togglePapercraft.addEventListener('change', (e) => { engine.setPapercraftMode(e.target.checked); });
            toggleIdle.addEventListener('change', (e) => { idleActions.forEach((a) => { a.paused = !e.target.checked; }); });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(clock.getDelta(), 0.05);
                if (engine.isPlaying) { engine.tick(dt); syncUI(); }
                if (mixer && toggleIdle.checked) mixer.update(dt);
                renderer.render(scene, camera);
            }
            animate();
        };
    </script>
</body>

</html>
